name: Windows Installers
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: windows-installers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  full-source-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package complete supermarket ERP source and Windows client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -r dist/NEW-FEED-SUPERMARKET-ERP-Full-Source.zip \
            NEW-FEED-SUPERMARKET-ERP desktop server-installer \
            .github/workflows/windows-installers.yml \
            .github/workflows/new-feed-supermarket-erp.yml README.md \
            -x '*/node_modules/*' '*/.env' '*/dist/*' '*/coverage/*'
          sha256sum dist/NEW-FEED-SUPERMARKET-ERP-Full-Source.zip > dist/NEW-FEED-SUPERMARKET-ERP-Full-Source.sha256
      - name: Upload complete source package
        uses: actions/upload-artifact@v4
        with:
          name: NEW-FEED-SUPERMARKET-ERP-Full-Source
          path: |
            dist/NEW-FEED-SUPERMARKET-ERP-Full-Source.zip
            dist/NEW-FEED-SUPERMARKET-ERP-Full-Source.sha256
          if-no-files-found: error
          retention-days: 30

  desktop-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Verify Windows server network hardening
        run: node --test ../server-installer/configuration.test.cjs
  build-windows:
    runs-on: windows-latest
    needs: desktop-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build employee Windows application
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npm run dist:win
      - name: Prepare server payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location NEW-FEED-SUPERMARKET-ERP
          npm install --omit=dev --no-audit --no-fund
          Pop-Location
          $payload = Join-Path $PWD 'dist/server-payload'
          New-Item -ItemType Directory -Force -Path "$payload/backend/apps/api" | Out-Null
          Copy-Item NEW-FEED-SUPERMARKET-ERP/package.json "$payload/backend/"
          Copy-Item NEW-FEED-SUPERMARKET-ERP/apps/api/src "$payload/backend/apps/api/" -Recurse
          Copy-Item NEW-FEED-SUPERMARKET-ERP/apps/web "$payload/backend/apps/web" -Recurse
          Copy-Item NEW-FEED-SUPERMARKET-ERP/database "$payload/backend/" -Recurse
          Copy-Item NEW-FEED-SUPERMARKET-ERP/scripts "$payload/backend/" -Recurse
          Copy-Item NEW-FEED-SUPERMARKET-ERP/node_modules "$payload/backend/" -Recurse
          Copy-Item (Get-Command node).Source "$payload/node.exe"
          Invoke-WebRequest -Uri 'https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW.NET461.exe' -OutFile "$payload/NewFeedERPService.exe"
          Copy-Item server-installer/NewFeedERPService.xml "$payload/"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build server setup EXE
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          & $iscc 'server-installer/ServerInstaller.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
      - name: Upload employee EXE
        uses: actions/upload-artifact@v4
        with:
          name: NEW-FEED-ERP-Employee-Windows-EXE
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload server EXE
        uses: actions/upload-artifact@v4
        with:
          name: NEW-FEED-ERP-Server-Windows-EXE
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
