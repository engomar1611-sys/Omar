name: NEW FEED ERP checks

on:
  push:
    branches: [main]
    paths:
      - "NEW-FEED-SUPERMARKET-ERP/**"
      - ".github/workflows/new-feed-supermarket-erp.yml"
  pull_request:
    branches: [main]
    paths:
      - "NEW-FEED-SUPERMARKET-ERP/**"
      - ".github/workflows/new-feed-supermarket-erp.yml"

permissions:
  contents: read

jobs:
  syntax-and-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: newfeed
          POSTGRES_PASSWORD: newfeed_ci_password
          POSTGRES_DB: newfeed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U newfeed -d newfeed_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: NEW-FEED-SUPERMARKET-ERP
    env:
      DATABASE_URL: postgresql://newfeed:newfeed_ci_password@localhost:5432/newfeed_test
      JWT_SECRET: ci-only-secret-key-with-more-than-32-characters
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check API and browser JavaScript syntax
        run: npm run check
      - name: Apply all PostgreSQL migrations
        run: npm run migrate
      - name: Verify supplier accounting schema and mappings
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('public.supplier_invoices') IS NULL
              OR to_regclass('public.supplier_invoice_lines') IS NULL
              OR to_regclass('public.supplier_payments') IS NULL
              OR to_regclass('public.supplier_payment_allocations') IS NULL
              OR to_regclass('public.supplier_returns') IS NULL
              OR to_regclass('public.supplier_return_lines') IS NULL
              OR to_regclass('public.supplier_return_allocations') IS NULL THEN
              RAISE EXCEPTION 'Supplier accounting tables are missing';
            END IF;
            IF (SELECT COUNT(*) FROM system_account_mappings m
                JOIN accounts a ON a.id=m.account_id
                WHERE (m.mapping_key='grni' AND a.code='2010')
                   OR (m.mapping_key='supplier_payables' AND a.code='2000')
                   OR (m.mapping_key='purchase_price_variance' AND a.code='5020')) <> 3 THEN
              RAISE EXCEPTION 'Supplier accounting ledger mappings are incomplete or point to the wrong accounts';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='supplier_payments' AND column_name='status'
            ) OR NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='supplier_payments' AND column_name='void_reason'
            ) THEN
              RAISE EXCEPTION 'Supplier payment reversal columns are missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM permissions WHERE code='supplier.accounting') THEN
              RAISE EXCEPTION 'Supplier accounting permission is missing';
            END IF;

            IF (SELECT COUNT(*) FROM (
              SELECT unnest(ARRAY[
                'products','product_barcodes','product_units','stock_lots',
                'purchase_orders','purchase_order_lines','purchase_receipts',
                'purchase_receipt_lines','sales','sale_lines','sale_payments',
                'payment_banks','journal_entries','journal_lines',
                'stocktakes','stocktake_lines'
              ]) AS table_name
            ) required
            WHERE to_regclass('public.'||required.table_name) IS NOT NULL) <> 16 THEN
              RAISE EXCEPTION 'One or more core supermarket ERP tables are missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='stock_lots' AND column_name='production_date'
            ) OR NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='stock_lots' AND column_name='purchase_date'
            ) OR NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='stock_lots' AND column_name='expiry_date'
            ) THEN
              RAISE EXCEPTION 'Stock lot production, purchase or expiry date fields are missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='sale_payments' AND column_name='transaction_reference'
            ) OR NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='sale_payments' AND column_name='card_last_four'
            ) OR NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='sale_payments' AND column_name='terminal_amount'
            ) THEN
              RAISE EXCEPTION 'Card terminal audit fields are missing';
            END IF;

            IF (SELECT COUNT(*) FROM payment_banks WHERE is_active) < 30 THEN
              RAISE EXCEPTION 'Egyptian bank directory is incomplete';
            END IF;

            IF (SELECT COUNT(*) FROM (
              SELECT unnest(ARRAY[
                'customer_loyalty_transactions','employee_attendance','payroll_runs',
                'payroll_lines','cash_sessions','bank_transactions','company_settings',
                'tax_codes','system_notifications'
              ]) AS table_name
            ) required
            WHERE to_regclass('public.'||required.table_name) IS NOT NULL) <> 9 THEN
              RAISE EXCEPTION 'Extended operational module tables are missing';
            END IF;

            IF (SELECT COUNT(*) FROM permissions WHERE code=ANY(ARRAY[
              'loyalty.manage','hr.attendance','hr.payroll','cash.manage',
              'bank.manage','settings.manage'
            ])) <> 6 THEN
              RAISE EXCEPTION 'Extended operational permissions are missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='payroll_runs' AND column_name='payment_reference'
            ) OR NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='payroll_runs' AND column_name='paid_by'
            ) THEN
              RAISE EXCEPTION 'Payroll payment audit fields are missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='sales' AND column_name='tax_code_id'
            ) THEN
              RAISE EXCEPTION 'Invoice tax code linkage is missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='sale_payments' AND column_name='cash_session_id'
            ) OR to_regclass('public.idx_sale_payments_cash_session') IS NULL
              OR to_regclass('public.uq_cash_session_one_open_per_cashier') IS NULL THEN
              RAISE EXCEPTION 'Exact cash session reconciliation linkage is missing';
            END IF;

            IF NOT EXISTS (SELECT 1 FROM roles WHERE code='HR_MANAGER')
              OR NOT EXISTS (
                SELECT 1 FROM role_permissions rp
                JOIN roles r ON r.id=rp.role_id
                JOIN permissions p ON p.id=rp.permission_id
                WHERE r.code='HR_MANAGER' AND p.code='hr.payroll'
              ) THEN
              RAISE EXCEPTION 'HR manager role defaults are missing';
            END IF;
          END $$;
          SQL


  source-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package supermarket ERP source only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd NEW-FEED-SUPERMARKET-ERP
          zip -r ../dist/NEW-FEED-SUPERMARKET-ERP-source.zip . \
            -x '*/node_modules/*' '*/.env' '*/dist/*' '*/coverage/*'
          cd ..
          sha256sum dist/NEW-FEED-SUPERMARKET-ERP-source.zip > dist/SHA256SUMS.txt
      - name: Upload supermarket ERP source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NEW-FEED-SUPERMARKET-ERP-Source
          path: |
            dist/NEW-FEED-SUPERMARKET-ERP-source.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
