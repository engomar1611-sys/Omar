name: NEW FEED ERP checks

on:
  push:
    branches: [main]
    paths:
      - "NEW-FEED-SUPERMARKET-ERP/**"
      - ".github/workflows/new-feed-supermarket-erp.yml"
  pull_request:
    branches: [main]
    paths:
      - "NEW-FEED-SUPERMARKET-ERP/**"
      - ".github/workflows/new-feed-supermarket-erp.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NEW-FEED-SUPERMARKET-ERP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
