<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تعريف النظام</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f2f6fa;color:#17324d;font-family:"Segoe UI",Tahoma,Arial,sans-serif}.wrap{padding:28px}.panel{background:#fff;border:1px solid #dce5ed;border-radius:16px;padding:26px;box-shadow:0 10px 35px #17324d12}.brand{font-size:22px;font-weight:700;color:#124d6a}.sub{color:#66798a;line-height:1.7;font-size:14px}label{display:block;font-weight:600;margin:24px 0 8px}input{width:100%;padding:14px;border:1px solid #b9c8d5;border-radius:9px;font:inherit;direction:ltr;text-align:left}button{border:0;border-radius:9px;padding:12px 18px;font:inherit;cursor:pointer;background:#176b87;color:#fff}.actions{display:flex;gap:10px;margin-top:16px}.hint{font-size:12px;color:#687b8d;line-height:1.8;margin-top:14px}.status{margin-top:18px;padding:12px;border-radius:9px;min-height:45px;background:#f1f5f8;color:#526577;font-size:13px}.ok{background:#e8f6ed;color:#21643d}.bad{background:#fff0ef;color:#a3332a}</style></head>
<body><main class="wrap"><section class="panel"><div class="brand">NEW FEED ERP</div><h2>تعريف النظام</h2><p class="sub">أدخل عنوان خادم النظام المركزي. جميع الموظفين يتصلون بنفس قاعدة البيانات من خلال الخادم.</p>
<label for="serverUrl">عنوان السيرفر + المنفذ</label><input id="serverUrl" type="url" placeholder="https://erp.example.local:3000">
<div class="actions"><button id="test">اختبار الاتصال</button><button id="save">حفظ والاتصال</button></div>
<p class="hint">الإنتاج يتطلب HTTPS وشهادة موثوقة في Windows. لا تتجاوز تحذير الشهادة ولا تثبّت شهادة مجهولة. يسمح بـ HTTP على localhost للاختبار المحلي فقط.</p><div id="status" class="status" role="status">لم يتم اختبار الاتصال بعد.</div></section></main><script src="./setup.js"></script></body></html>
