<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a43"><title>NEW FEED ERP | نظام إدارة مصانع الأعلاف</title>
<style>
:root{font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:#172b4d;background:#f3f6fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{background:#102a43;color:#e8f1f8;padding:22px 14px}.brand{padding:8px 12px 24px;border-bottom:1px solid #34516b}.brand b{font-size:20px;display:block;letter-spacing:.4px}.brand small{color:#a9c2d8}.nav{display:grid;gap:5px;margin-top:20px}.nav button{border:0;background:transparent;color:#d5e3ef;text-align:right;padding:12px;border-radius:9px;cursor:pointer}.nav button.active,.nav button:hover{background:#244966;color:#fff}.main{min-width:0}.top{height:72px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.top strong{font-size:18px}.muted{color:#718096;font-size:13px}.content{padding:26px;max-width:1500px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.welcome h1{margin:0 0 5px;font-size:25px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin:20px 0}.card,.panel{background:white;border:1px solid #e5ebf1;border-radius:13px;padding:18px;box-shadow:0 3px 12px #102a4308}.card small{color:#718096}.metric{font-size:27px;font-weight:700;margin-top:10px}.panel{margin-top:16px}.panel h2{font-size:17px;margin:0 0 15px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:10px 15px;cursor:pointer;background:#176b87;color:white}.btn.secondary{background:#e8f0f5;color:#244966}.btn.danger{background:#a53c3c}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:right;padding:12px;border-bottom:1px solid #edf1f5;font-size:13px}th{color:#64748b;background:#f8fafc;font-weight:600}.status{padding:4px 8px;border-radius:20px;background:#e8f5ee;color:#24734a;font-size:12px}.empty{padding:30px;text-align:center;color:#718096}.login-wrap{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#102a43,#176b87);padding:20px}.login{background:white;width:min(420px,100%);padding:30px;border-radius:16px;box-shadow:0 18px 60px #071c2d55}.login h1{margin:0 0 6px}.field{display:grid;gap:7px;margin:14px 0}.field input,.field select,.field textarea{padding:12px;border:1px solid #cbd5e1;border-radius:8px;width:100%;background:#fff}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.form-grid .field{margin:5px 0}.form-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.row-actions{display:flex;gap:6px}.btn:disabled{opacity:.5;cursor:not-allowed}@media(max-width:520px){.form-grid{grid-template-columns:1fr}}.error{color:#b42318;font-size:13px;min-height:20px}.hidden{display:none!important}.notice{padding:12px;background:#fff8e6;border:1px solid #f4dfad;border-radius:9px;color:#805b13;margin:12px 0;font-size:13px}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:15px}.toolbar input{padding:10px;border:1px solid #d5dee8;border-radius:8px;min-width:230px}.user{display:flex;align-items:center;gap:12px}.pill{background:#e8f0f5;border-radius:30px;padding:7px 11px;font-size:12px}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{padding:12px}.brand{padding-bottom:12px}.nav{display:flex;overflow:auto;margin-top:10px}.nav button{white-space:nowrap}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.top{padding:0 16px}.content{padding:16px}}@media(max-width:520px){.cards{grid-template-columns:1fr 1fr}.welcome{align-items:flex-start;gap:12px;flex-direction:column}.toolbar{align-items:stretch;flex-direction:column}.toolbar input{width:100%}}
</style></head>
<body>
<section id="loginView" class="login-wrap"><form id="loginForm" class="login"><h1>NEW FEED ERP</h1><p class="muted">نظام إدارة وتشغيل مصانع الأعلاف</p><div class="field"><label>اسم المستخدم</label><input id="username" autocomplete="username" required></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" style="width:100%">تسجيل الدخول</button><p id="loginError" class="error"></p><small class="muted">اتصل بمدير النظام للحصول على بيانات الدخول.</small></form></section>
<div id="appView" class="shell hidden"><aside class="side"><div class="brand"><b>NEW FEED ERP</b><small>إدارة مصنع الأعلاف</small></div><nav class="nav" id="nav"></nav></aside><main class="main"><header class="top"><strong id="pageTitle">لوحة التحكم</strong><div class="user"><span id="userName" class="muted"></span><button id="logout" class="btn secondary">خروج</button></div></header><div class="content" id="content"></div></main></div>
<script>
const $=s=>document.querySelector(s);let token=sessionStorage.getItem('nferp_token')||'';let currentUser=null;
const modules=[
 ['home','لوحة التحكم','⌂',null],
 ['items','الأصناف والخامات','▦','/api/v1/master/items'],
 ['suppliers','الموردون','♙','/api/v1/suppliers'],
 ['purchases','المشتريات وأوامر الشراء','▤','/api/v1/purchases'],
 ['receipts','استلام وفحص الجودة','✓','/api/v1/goods-receipts'],
 ['inventory','أرصدة المخزون','▣','/api/v1/inventory/balances'],
 ['formulations','التركيبات','⚗','/api/v1/formulations'],
 ['production','أوامر الإنتاج','⚙','/api/v1/production/orders'],
 ['customers','العملاء','♧','/api/v1/customers'],
 ['sales','فواتير المبيعات','▧','/api/v1/sales/invoices'],
 ['cashReceipts','سندات القبض','◉','/api/v1/accounting/receipts'],
 ['returns','مرتجعات المبيعات','↩','/api/v1/sales/returns'],
 ['expenses','المصروفات','∑','/api/v1/accounting/expenses'],
 ['deliveries','التجهيز والتسليم','➜','/api/v1/sales/deliveries'],
 ['journals','الحسابات والقيود','₪','/api/v1/accounting/journals']
];
function headers(){return {'Authorization':'Bearer '+token,'Content-Type':'application/json'}}
async function api(path){const r=await fetch(path,{headers:headers()});if(r.status===401){logout();throw Error('انتهت جلسة الدخول')}if(!r.ok){let d={};try{d=await r.json()}catch{}throw Error(d.message||d.error||('HTTP '+r.status))}return r.status===204?null:r.json()}
async function apiPost(path,body){const r=await fetch(path,{method:'POST',headers:headers(),body:JSON.stringify(body)});if(r.status===401){logout();throw Error('انتهت جلسة الدخول')}let d=null;try{d=await r.json()}catch{}if(!r.ok)throw Error(d?.message||d?.error||('HTTP '+r.status));return d}
async function apiPut(path,body){const r=await fetch(path,{method:'PUT',headers:headers(),body:JSON.stringify(body)});let d=null;try{d=await r.json()}catch{}if(!r.ok)throw Error(d?.message||d?.error||('HTTP '+r.status));return d}
function can(permission){return Array.isArray(currentUser?.permissions)&&currentUser.permissions.includes(permission)}
function showLogin(){ $('#loginView').classList.remove('hidden');$('#appView').classList.add('hidden') }
function showApp(){ $('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');$('#userName').textContent=currentUser?.displayName||currentUser?.username||'';renderNav();go('home') }
async function login(username,password){const r=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});const d=await r.json();if(!r.ok)throw Error(d.message||'تعذر تسجيل الدخول');token=d.accessToken;sessionStorage.setItem('nferp_token',token);currentUser=await api('/api/v1/auth/me');showApp()}
async function logout(){try{if(token)await fetch('/api/v1/auth/logout',{method:'POST',headers:headers()})}catch{}token='';currentUser=null;sessionStorage.removeItem('nferp_token');showLogin()}
function renderNav(){const nav=$('#nav');nav.innerHTML='';modules.forEach(m=>{const b=document.createElement('button');b.dataset.id=m[0];b.textContent=m[2]+'  '+m[1];b.onclick=()=>go(m[0]);nav.append(b)})}
function activate(id){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id))}
function fmt(v){if(v===null||v===undefined||v==='')return '—';if(typeof v==='object')return JSON.stringify(v);return String(v)}
function table(rows){if(!Array.isArray(rows)||!rows.length)return '<div class="empty">لا توجد بيانات للعرض أو لا توجد سجلات متاحة.</div>';const cols=Object.keys(rows[0]).slice(0,9);return '<div class="table-wrap"><table><thead><tr>'+cols.map(c=>'<th>'+escapeHtml(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+cols.map(c=>'<td>'+escapeHtml(fmt(row[c]))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function go(id){activate(id);const m=modules.find(x=>x[0]===id);$('#pageTitle').textContent=m?.[1]||'لوحة التحكم';const c=$('#content');c.innerHTML='<div class="panel">جارٍ تحميل البيانات...</div>';
if(id==='home'){try{const checks=await Promise.allSettled(['/health','/ready'].map(p=>fetch(p).then(r=>r.json())));const health=checks[0].status==='fulfilled'?checks[0].value.status:'غير متاح';const ready=checks[1].status==='fulfilled'?checks[1].value.database:'غير متاح';const counts=await Promise.allSettled(['/api/v1/suppliers','/api/v1/master/items','/api/v1/inventory/balances','/api/v1/production/orders'].map(api));const labels=['الموردون','الأصناف','أرصدة المخزون','أوامر الإنتاج'];const cards=counts.map((x,i)=>'<div class="card"><small>'+labels[i]+'</small><div class="metric">'+(x.status==='fulfilled'?x.value.length:'—')+'</div></div>').join('');c.innerHTML='<div class="welcome"><div><h1>مرحباً بك في NEW FEED ERP</h1><div class="muted">مركز متابعة وتشغيل المصنع</div></div><span class="pill">العملة: جنيه مصري</span></div><div class="cards">'+cards+'</div><div class="panel"><h2>حالة النظام</h2><div class="actions"><span class="pill">خدمة API: '+escapeHtml(health)+'</span><span class="pill">قاعدة البيانات: '+escapeHtml(ready)+'</span></div></div><div class="panel"><h2>اختصارات التشغيل</h2><div class="actions">'+modules.slice(1,7).map(x=>'<button class="btn secondary" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</div></div><div class="notice">هذه الواجهة مرتبطة بنقاط API الحالية. الشاشات التي لم تكتمل خدماتها بعد ستظهر رسالة عدم توفر البيانات، ولن يتم عرض بيانات تجريبية على أنها بيانات حقيقية.</div>';return}catch(e){c.innerHTML='<div class="notice">'+escapeHtml(e.message)+'</div>';return}}
try{const rows=await api(m[3]);if(id==='formulations'){c.innerHTML='<div class="toolbar"><span>عدد التركيبات: '+rows.length+'</span>'+(can('FORMULATIONS.MANAGE')?'<button class="btn" id="newF">إنشاء تركيبة</button>':'')+'</div><div id="entryForm"></div><div class="panel" id="dataPanel"></div>';if($('#newF'))$('#newF').onclick=()=>formulationForm();renderFormulations(rows);return}if(id==='production'){c.innerHTML='<div class="toolbar"><span>أوامر الإنتاج: '+rows.length+'</span>'+(can('PRODUCTION.MANAGE')?'<button class="btn" id="newP">إنشاء أمر إنتاج</button>':'')+'</div><div id="entryForm"></div><div class="panel" id="dataPanel"></div>';if($('#newP'))$('#newP').onclick=()=>productionForm();renderProduction(rows);return}if(['customers','sales','cashReceipts','returns','expenses'].includes(id)){let action='';if(id==='customers'&&can('CUSTOMERS.MANAGE'))action='<button class="btn" id="newCustomer">إضافة عميل</button>';if(id==='sales'&&can('SALES.MANAGE'))action='<button class="btn" id="newSalesInvoice">إنشاء فاتورة</button>';if(id==='cashReceipts'&&can('RECEIPTS.MANAGE'))action='<button class="btn" id="newCashReceipt">تسجيل سند قبض</button>';if(id==='returns'&&can('RETURNS.MANAGE'))action='<button class="btn" id="newSalesReturn">إنشاء مرتجع</button>';if(id==='expenses'&&can('EXPENSES.MANAGE'))action='<button class="btn" id="newExpense">تسجيل مصروف</button>';c.innerHTML='<div class="toolbar"><div class="actions"><span class="muted">عدد السجلات: '+rows.length+'</span>'+action+'</div><input id="filter" placeholder="بحث داخل البيانات المعروضة..."></div><div id="entryForm"></div><div class="panel" id="dataPanel">'+(id==='returns'?'':table(rows))+'</div>';if($('#filter'))$('#filter').oninput=()=>{const q=$('#filter').value.toLowerCase();$('#dataPanel').innerHTML=table(rows.filter(x=>JSON.stringify(x).toLowerCase().includes(q)))};if($('#newCustomer'))$('#newCustomer').onclick=customerForm;if($('#newSalesInvoice'))$('#newSalesInvoice').onclick=salesInvoiceForm;if($('#newCashReceipt'))$('#newCashReceipt').onclick=cashReceiptForm;if($('#newSalesReturn'))$('#newSalesReturn').onclick=salesReturnForm;if($('#newExpense'))$('#newExpense').onclick=expenseForm;if(id==='returns')renderSalesReturns(rows);return}let tools='';if(id==='receipts'&&can('RECEIVING.MANAGE'))tools='<button class="btn" id="newReceipt">إنشاء إذن استلام</button>';if(id==='suppliers'&&can('SUPPLIERS.MANAGE'))tools='<button class="btn" id="newSupplier">إضافة مورد</button>';if(id==='purchases'&&can('PURCHASES.MANAGE'))tools='<button class="btn" id="newPurchase">إنشاء أمر شراء</button>';c.innerHTML='<div class="toolbar"><div class="actions"><span class="muted">عدد السجلات: '+(Array.isArray(rows)?rows.length:0)+'</span>'+tools+'</div><input id="filter" placeholder="بحث داخل البيانات المعروضة..."></div><div id="entryForm"></div><div class="panel" id="dataPanel">'+table(rows)+'</div>';const f=$('#filter');if(f)f.oninput=()=>{const q=f.value.toLowerCase();const filtered=rows.filter(x=>JSON.stringify(x).toLowerCase().includes(q));$('#dataPanel').innerHTML=table(filtered)};if(id==='suppliers'&&$('#newSupplier'))$('#newSupplier').onclick=()=>supplierForm();if(id==='receipts'){if($('#newReceipt'))$('#newReceipt').onclick=()=>receiptForm();if(can('QUALITY.APPROVE'))renderReceiptQC(rows)}if(id==='purchases'){if($('#newPurchase'))$('#newPurchase').onclick=()=>purchaseForm();if(can('PURCHASES.APPROVE'))renderPurchaseApprovals(rows)}}catch(e){c.innerHTML='<div class="panel"><h2>تعذر تحميل الشاشة</h2><div class="notice">'+escapeHtml(e.message)+'</div><p class="muted">تحقق من صلاحية المستخدم ومن تفعيل الخدمة المرتبطة بهذه الشاشة.</p></div>'}}
async function supplierForm(){const host=$('#entryForm');host.innerHTML='<div class="panel"><h2>إضافة مورد جديد</h2><form id="supplierEntry"><div class="form-grid"><div class="field"><label>كود المورد *</label><input name="code" required maxlength="40"></div><div class="field"><label>اسم المورد *</label><input name="nameAr" required maxlength="200"></div><div class="field"><label>الرقم الضريبي</label><input name="taxNumber"></div><div class="field"><label>الهاتف</label><input name="phone"></div><div class="field"><label>العنوان</label><input name="address"></div><div class="field"><label>مدة السداد بالأيام</label><input name="paymentTermsDays" type="number" min="0" value="0"></div></div><p id="entryError" class="error"></p><div class="form-actions"><button class="btn">حفظ المورد</button><button type="button" class="btn secondary" id="cancelEntry">إلغاء</button></div></form></div>';$('#cancelEntry').onclick=()=>host.innerHTML='';$('#supplierEntry').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.paymentTermsDays=Number(d.paymentTermsDays);try{await apiPost('/api/v1/suppliers',d);await go('suppliers')}catch(err){$('#entryError').textContent=err.message}}}
async function purchaseForm(){const host=$('#entryForm');host.innerHTML='<div class="panel"><h2>إنشاء أمر شراء</h2><p class="muted">أدخل البنود المطلوبة. لا يتم إدخال المخزون إلا بعد الاستلام وفحص الجودة.</p><form id="purchaseEntry"><div class="form-grid"><div class="field"><label>رقم أمر الشراء *</label><input name="orderNo" required maxlength="40"></div><div class="field"><label>المورد *</label><select name="supplierId" id="poSupplier" required></select></div><div class="field"><label>المخزن *</label><select name="warehouseId" id="poWarehouse" required></select></div><div class="field"><label>تاريخ التوريد المتوقع</label><input name="expectedDate" type="date"></div></div><div id="poLines"></div><div class="form-actions"><button type="button" class="btn secondary" id="addPoLine">إضافة بند</button><button class="btn">حفظ كمسودة</button><button type="button" class="btn secondary" id="cancelEntry">إلغاء</button></div><p id="entryError" class="error"></p></form></div>';try{const [suppliers,warehouses,items]=await Promise.all([api('/api/v1/suppliers'),api('/api/v1/master/warehouses'),api('/api/v1/master/items')]);$('#poSupplier').innerHTML='<option value="">اختر المورد</option>'+suppliers.filter(x=>x.is_active).map(x=>'<option value="'+escapeHtml(x.id)+'">'+escapeHtml(x.code+' - '+x.name_ar)+'</option>').join('');$('#poWarehouse').innerHTML='<option value="">اختر المخزن</option>'+warehouses.filter(x=>x.is_active).map(x=>'<option value="'+escapeHtml(x.id)+'">'+escapeHtml(x.code+' - '+x.name_ar)+'</option>').join('');const addLine=()=>{const el=document.createElement('div');el.className='form-grid';el.style.borderTop='1px solid #edf1f5';el.style.paddingTop='8px';el.innerHTML='<div class="field"><label>الصنف</label><select class="poItem" required><option value="">اختر الصنف</option>'+items.filter(x=>x.is_active).map(x=>'<option value="'+escapeHtml(x.id)+'">'+escapeHtml(x.code+' - '+x.name_ar)+'</option>').join('')+'</select></div><div class="field"><label>الكمية</label><input class="poQty" type="number" min="0.001" step="0.001" required></div><div class="field"><label>تكلفة الوحدة (جنيه)</label><input class="poCost" type="number" min="0" step="0.01" required></div>';$('#poLines').append(el)};addLine();$('#addPoLine').onclick=addLine;$('#cancelEntry').onclick=()=>host.innerHTML='';$('#purchaseEntry').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);const lines=[...$('#poLines').children].map(x=>({itemId:x.querySelector('.poItem').value,quantity:Number(x.querySelector('.poQty').value),unitCost:Number(x.querySelector('.poCost').value)}));const body={orderNo:fd.get('orderNo'),supplierId:fd.get('supplierId'),warehouseId:fd.get('warehouseId'),expectedDate:fd.get('expectedDate')||null,lines};try{await apiPost('/api/v1/purchases',body);await go('purchases')}catch(err){$('#entryError').textContent=err.message}}}catch(err){$('#entryError').textContent=err.message}}
function renderPurchaseApprovals(rows){const panel=$('#dataPanel');if(!panel)return;const drafts=rows.filter(x=>x.status==='DRAFT');if(!drafts.length)return;const box=document.createElement('div');box.className='notice';box.innerHTML='<strong>أوامر شراء بانتظار الاعتماد</strong><div class="actions" id="poApprovalActions"></div>';panel.prepend(box);drafts.forEach(x=>{const b=document.createElement('button');b.className='btn secondary';b.textContent='اعتماد '+(x.order_no||'أمر شراء');b.onclick=async()=>{if(!confirm('تأكيد اعتماد أمر الشراء؟'))return;try{await apiPost('/api/v1/purchases/'+encodeURIComponent(x.id)+'/approve',{});await go('purchases')}catch(e){alert(e.message)}};box.querySelector('#poApprovalActions').append(b)})}


async function formulationForm(x=null){
 const host=$('#entryForm');host.innerHTML='<div class="panel"><h2>'+(x?'تعديل تركيبة مسودة':'إنشاء تركيبة')+'</h2><form id="fEntry"><div class="form-grid"><div class="field"><label>المنتج</label><select id="fProduct" required></select></div><div class="field"><label>رقم الإصدار</label><input id="fVersion" type="number" min="1" required value="'+(x?.version_no||1)+'"></div><div class="field"><label>سارية من</label><input id="fFrom" type="date"></div><div class="field"><label>سارية حتى</label><input id="fTo" type="date"></div><div class="field"><label>ملاحظات</label><textarea id="fNotes"></textarea></div></div><div id="fLines"></div><div class="form-actions"><button type="button" class="btn secondary" id="fAdd">إضافة خامة</button><button class="btn">حفظ</button><button type="button" class="btn secondary" id="fCancel">إلغاء</button></div><p id="fError" class="error"></p></form></div>';
 try{const [products,items]=await Promise.all([api('/api/v1/master/feed-products'),api('/api/v1/master/items')]);$('#fProduct').innerHTML='<option value="">اختر المنتج</option>'+products.filter(p=>p.is_active).map(p=>'<option value="'+p.id+'">'+escapeHtml(p.code+' - '+p.name_ar)+'</option>').join('');if(x){$('#fProduct').value=x.feed_product_id;$('#fProduct').disabled=true;$('#fFrom').value=x.effective_from?.slice(0,10)||'';$('#fTo').value=x.effective_to?.slice(0,10)||'';$('#fNotes').value=x.notes||'';}

async function expenseForm(){const host=$('#entryForm');host.innerHTML='<div class="panel"><h2>تسجيل مصروف</h2><form id="exEntry"><div class="form-grid"><div class="field"><label>رقم المصروف</label><input name="expenseNo" required></div><div class="field"><label>حساب المصروف</label><select name="accountId" id="exAccount" required></select></div><div class="field"><label>المبلغ بالجنيه</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>طريقة الدفع</label><select name="paymentMethod"><option value="CASH">نقدي</option><option value="BANK">بنك</option></select></div><div class="field"><label>البيان</label><input name="description" required></div></div><div class="form-actions"><button class="btn">حفظ وترحيل القيد</button><button type="button" class="btn secondary" id="exCancel">إلغاء</button></div><p id="exError" class="error"></p></form></div>';try{const accounts=await api('/api/v1/accounting/accounts');$('#exAccount').innerHTML='<option value="">اختر الحساب</option>'+accounts.map(a=>'<option value="'+a.id+'">'+escapeHtml(a.code+' - '+a.name_ar)+'</option>').join('');$('#exCancel').onclick=()=>host.innerHTML='';$('#exEntry').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.amount=Number(d.amount);try{await apiPost('/api/v1/accounting/expenses',d);await go('expenses')}catch(err){$('#exError').textContent=err.message}}}catch(err){$('#exError').textContent=err.message}}
function renderSalesReturns(rows){const host=$('#dataPanel');rows.forEach(x=>{const d=document.createElement('div');d.className='notice';d.innerHTML='<b>مرتجع '+escapeHtml(x.return_no)+' — '+escapeHtml(x.invoice_no)+' — '+escapeHtml(x.customer_name)+' — '+escapeHtml(x.status)+'</b><div class="actions"></div>';const a=d.querySelector('.actions'),btn=(t,fn)=>{const b=document.createElement('button');b.className='btn secondary';b.textContent=t;b.onclick=fn;a.append(b)};if(x.status==='PENDING_WAREHOUSE'&&can('RETURNS.WAREHOUSE_APPROVE'))btn('اعتماد المخزن',async()=>{try{await apiPost('/api/v1/sales/returns/'+x.id+'/warehouse-approve',{});await go('returns')}catch(e){alert(e.message)}});if(x.status==='PENDING_ACCOUNTING'&&can('RETURNS.ACCOUNTING_APPROVE'))btn('الاعتماد المالي',async()=>{try{await apiPost('/api/v1/sales/returns/'+x.id+'/accounting-approve',{});await go('returns')}catch(e){alert(e.message)}});if(x.status==='APPROVED'&&can('QUALITY.APPROVE'))btn('فحص المرتجع',async()=>{const result=prompt('PASS قبول / FAIL حجر / CONDITIONAL حجر','PASS');if(!['PASS','FAIL','CONDITIONAL'].includes(result))return;try{await apiPost('/api/v1/quality/sales-returns/'+x.id+'/inspect',{result});await go('returns')}catch(e){alert(e.message)}});host.append(d)})}
